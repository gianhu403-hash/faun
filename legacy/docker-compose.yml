name: faun

services:
  cloud:
    build:
      context: .
      dockerfile: cloud/Dockerfile
    ports:
      # Loopback only — public access goes through delphi-press nginx
      # reverse proxy to host port 8002 (8000 is taken by delphi-press-app).
      - "127.0.0.1:8002:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - yamnet_cache:/tmp/yamnet_cache
    depends_on:
      lora_gateway:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 360s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  edge:
    build:
      context: .
      dockerfile: edge/Dockerfile
    command: sh -c "python demo/generate_audio.py && python -m edge.server"
    ports:
      # Loopback only — internal use by cloud over the faun_net network.
      - "127.0.0.1:8003:8001"
    env_file:
      - .env
    volumes:
      - .:/app
      - yamnet_cache:/tmp/yamnet_cache
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  lora_gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    command: python -m gateway.relay
    ports:
      - "127.0.0.1:9000:9000"
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  yamnet_cache:

networks:
  default:
    name: faun_net
