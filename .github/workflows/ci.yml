name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-pipeline.txt && pip install pytest pytest-asyncio
      - run: python -m pytest tests/ -v --tb=short
      - name: Bandit setup
        run: pip install bandit
      - name: Bandit (visibility — log all low+, never fail)
        run: bandit -r faun -ll -x legacy --exit-zero
      - name: Bandit (fail-gate — HIGH severity only)
        run: bandit -r faun --severity-level high -x legacy
      - name: pip-audit setup
        run: pip install pip-audit
      - name: pip-audit pipeline (soft — surprise CVE must not block tonight's merges)
        run: pip-audit -r requirements-pipeline.txt || true
