name: Deploy

# Auto-deploy DISABLED 2026-06-11.
#
# The old target VPS (delphi-press / 213.165.220.144) was physically deleted
# 2026-05-30. Faun now runs on the cluster-alex node, fronted by the `anchor`
# nginx ingress (faun.antopkin.ru -> tailnet 100.64.0.1:8003).
#
# GitHub Actions runners cannot reach the tailnet, so push-to-deploy is not
# wired here. Deploy is manual on the cluster for now; CI/CD-to-cluster
# (self-hosted runner or ssh-jump) is a July task. See docs/deployment.md.
#
# Trigger is workflow_dispatch only so a push to main never spawns a (failing)
# deploy run.

on:
  workflow_dispatch:

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy moved to cluster
        run: |
          echo "Auto-deploy is disabled. Faun runs on cluster-alex (tailnet)."
          echo "Ingress: faun.antopkin.ru -> anchor nginx -> 100.64.0.1:8003."
          echo "Manual deploy on cluster; CI/CD-to-cluster is a July task."
          echo "See docs/deployment.md."
