<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Faun — акустический пайплайн</title>
  <style>
    :root { --bg:#0f1419; --panel:#1a2129; --fg:#e6edf3; --muted:#8b98a5; --accent:#3fb950; --err:#f85149; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
    main { max-width:760px; margin:0 auto; padding:32px 20px; }
    h1 { font-size:22px; margin:0 0 4px; }
    p.sub { color:var(--muted); margin:0 0 24px; }
    .card { background:var(--panel); border:1px solid #2a3038; border-radius:10px; padding:20px; margin-bottom:20px; }
    label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
    input { width:100%; padding:9px 11px; background:#0d1117; border:1px solid #30363d; border-radius:6px; color:var(--fg); font-size:14px; }
    .row { display:flex; gap:12px; }
    .row > div { flex:1; }
    button { margin-top:16px; padding:10px 18px; background:var(--accent); color:#07120a; border:0; border-radius:6px; font-weight:600; font-size:14px; cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .status { font-size:14px; }
    .status .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:600; }
    .badge.pending,.badge.running { background:#1f2d3d; color:#58a6ff; }
    .badge.done { background:#15351f; color:var(--accent); }
    .badge.error { background:#3d1f1f; color:var(--err); }
    progress { width:100%; height:8px; margin-top:10px; }
    table { width:100%; border-collapse:collapse; margin-top:14px; font-size:13px; }
    th,td { text-align:left; padding:7px 9px; border-bottom:1px solid #262c34; }
    th { color:var(--muted); font-weight:600; }
    a.dl { display:inline-block; margin-top:14px; color:var(--accent); }
    .hidden { display:none; }
    .err-msg { color:var(--err); margin-top:10px; }
  </style>
</head>
<body>
<main>
  <h1>Faun — биоакустический pipeline</h1>
  <p class="sub">Обработка записей с акустических ловушек: сегментация и определение видов.</p>

  <div class="card">
    <form id="job-form">
      <label for="source">Папка с записями или URL</label>
      <input id="source" name="source" placeholder="/data/traps/A1 или https://…" required />
      <div class="row">
        <div>
          <label for="lat">Широта (lat)</label>
          <input id="lat" name="lat" type="number" step="any" placeholder="опц." />
        </div>
        <div>
          <label for="lon">Долгота (lon)</label>
          <input id="lon" name="lon" type="number" step="any" placeholder="опц." />
        </div>
      </div>
      <button type="submit" id="submit-btn">Запустить обработку</button>
      <div class="err-msg hidden" id="form-err"></div>
    </form>
  </div>

  <div class="card hidden" id="status-card">
    <div class="status">
      Задача <code id="job-id"></code> —
      <span class="badge pending" id="badge">pending</span>
    </div>
    <progress id="bar" max="1" value="0"></progress>
    <div class="err-msg hidden" id="run-err"></div>
    <table id="results" class="hidden">
      <thead>
        <tr><th>track</th><th>start, с</th><th>длит., с</th><th>вид</th><th>вероятность</th></tr>
      </thead>
      <tbody id="results-body"></tbody>
    </table>
    <a class="dl hidden" id="dl-link" download>Скачать CSV</a>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let pollTimer = null;
let pollFails = 0;

// Minimal CSV row parser: respects double-quoted fields (so a value with a
// comma doesn't shift columns) and "" escaping. Display-only.
function parseCsvRow(line) {
  const out = [];
  let cur = "", q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) {
      if (c === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; } else { q = false; }
      } else { cur += c; }
    } else if (c === '"') { q = true; }
    else if (c === ",") { out.push(cur); cur = ""; }
    else { cur += c; }
  }
  out.push(cur);
  return out;
}

$("job-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("form-err").classList.add("hidden");
  $("submit-btn").disabled = true;

  const source = $("source").value.trim();
  const lat = $("lat").value ? parseFloat($("lat").value) : null;
  const lon = $("lon").value ? parseFloat($("lon").value) : null;
  const body = { source_path: source, lat, lon };

  try {
    const res = await fetch("/jobs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error("Сервер вернул " + res.status);
    const { job_id } = await res.json();
    startPolling(job_id);
  } catch (err) {
    $("form-err").textContent = err.message;
    $("form-err").classList.remove("hidden");
    $("submit-btn").disabled = false;
  }
});

function startPolling(jobId) {
  $("status-card").classList.remove("hidden");
  $("job-id").textContent = jobId;
  $("results").classList.add("hidden");
  $("dl-link").classList.add("hidden");
  $("run-err").classList.add("hidden");

  if (pollTimer) clearInterval(pollTimer);
  pollFails = 0;
  pollTimer = setInterval(() => poll(jobId), 2000);
  poll(jobId);
}

async function poll(jobId) {
  let res;
  try {
    res = await fetch(`/jobs/${jobId}`);
  } catch (err) {
    res = null;  // network error — treat as a poll failure
  }
  if (!res || !res.ok) {
    pollFails++;
    const code = res ? res.status : "сеть";
    if (pollFails >= 10) {
      clearInterval(pollTimer);
      $("run-err").textContent =
        "Опрос остановлен после 10 неудач подряд (HTTP " + code + ").";
      $("run-err").classList.remove("hidden");
      $("submit-btn").disabled = false;
    } else if (pollFails >= 3) {
      $("run-err").textContent =
        "Ошибка опроса (HTTP " + code + "), пробую ещё…";
      $("run-err").classList.remove("hidden");
    }
    return;
  }
  pollFails = 0;
  $("run-err").classList.add("hidden");
  const m = await res.json();

  const badge = $("badge");
  badge.textContent = m.status;
  badge.className = "badge " + m.status;
  if (typeof m.progress === "number") $("bar").value = m.progress;

  if (m.status === "done") {
    clearInterval(pollTimer);
    $("bar").value = 1;
    await loadResults(jobId);
    $("submit-btn").disabled = false;
  } else if (m.status === "error") {
    clearInterval(pollTimer);
    $("run-err").textContent = "Ошибка: " + (m.error || "неизвестно");
    $("run-err").classList.remove("hidden");
    $("submit-btn").disabled = false;
  }
}

// Deep-link: ?job=<id> resumes polling/viewing an existing job.
window.addEventListener("DOMContentLoaded", () => {
  const jid = new URLSearchParams(location.search).get("job");
  if (jid) startPolling(jid);
});

async function loadResults(jobId) {
  const url = `/jobs/${jobId}/results.csv`;
  const res = await fetch(url);
  if (!res.ok) return;
  const text = await res.text();
  const rows = text.trim().split("\n").map(parseCsvRow);
  const body = $("results-body");
  body.innerHTML = "";
  rows.slice(1).forEach((cols) => {
    const tr = document.createElement("tr");
    cols.forEach((c) => {
      const td = document.createElement("td");
      td.textContent = c;
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
  $("results").classList.remove("hidden");
  $("dl-link").href = url;
  $("dl-link").classList.remove("hidden");
}
</script>
</body>
</html>
